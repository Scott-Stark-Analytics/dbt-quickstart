version: 2

sources:
    - name: jaffle_shop
      description: This is a replica of the Postgres database used by our app
      database: dbt-tutorial
      schema: jaffle_shop
      tables:
          - name: customers
            description: Raw customer data
            columns:
              - name: id
                description: Primary Key, unique id associated with a single customer
                tests:
                  - unique
                  - not_null
          - name: orders
            description: Raw orders data. Includes cancelled and deleted orders.
            config:
              freshness:
                warn_after:
                  count: 6
                  period: hour
                error_after:
                  count: 12
                  period: hour
                loaded_at_field: _etl_loaded_at
            columns:
              - name: id
                tests:
                  - unique
                  - not_null
