version: 2

models:
  - name: stg_customers
    description: One unique customer per row
    columns:
      - name: customer_id
        description: Primary Key identifying a unique customer
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: each row represents one order
    columns:
      - name: order_id
        description: Primary Key identifying a unique order
        tests:
          - unique
          - not_null
      - name: status
        description: "{{doc('order_status')}}"
        tests:
          - accepted_values:
              values:
                ["placed", "shipped", "completed", "return_pending", "returned"]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
